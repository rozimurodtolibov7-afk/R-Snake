<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>SNOW DASH</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Exo+2:wght@400;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;}
html,body{width:100%;height:100%;overflow:hidden;background:#000d1a;font-family:'Exo 2',sans-serif;color:#fff;touch-action:none;}

/* ── LANG SCREEN ── */
#langScr{position:fixed;inset:0;z-index:900;background:radial-gradient(ellipse at 50% 40%,#001a2e 0%,#000d1a 60%,#000 100%);display:flex;flex-direction:column;align-items:center;justify-content:center;}
.logo{font-family:'Orbitron',monospace;font-size:clamp(2rem,9vw,3.6rem);font-weight:900;color:#e8f4ff;text-shadow:0 0 30px rgba(100,180,255,.6),0 0 60px rgba(100,180,255,.2);animation:snowglow 3s ease-in-out infinite alternate;letter-spacing:6px;}
.logo-sub{font-family:'Exo 2',sans-serif;font-size:.7rem;letter-spacing:7px;color:rgba(150,200,255,.4);text-transform:uppercase;margin-top:6px;}
@keyframes snowglow{from{text-shadow:0 0 20px rgba(100,180,255,.4),0 0 40px rgba(100,180,255,.15);}to{text-shadow:0 0 50px rgba(100,180,255,.8),0 0 100px rgba(100,180,255,.3);}}
.snowflakes{position:absolute;inset:0;pointer-events:none;overflow:hidden;}
.sf{position:absolute;color:rgba(255,255,255,.35);font-size:.8rem;animation:fall linear infinite;}
@keyframes fall{0%{transform:translateY(-20px) rotate(0deg);opacity:.7;}100%{transform:translateY(105vh) rotate(360deg);opacity:0;}}
.lang-hint{font-size:.62rem;letter-spacing:5px;color:rgba(255,255,255,.25);text-transform:uppercase;margin:44px 0 16px;}
.lang-row{display:flex;gap:13px;}
.lang-btn{background:rgba(100,180,255,.07);border:1px solid rgba(100,180,255,.25);color:rgba(200,230,255,.9);padding:14px 20px;font-family:'Orbitron',monospace;font-size:.78rem;font-weight:700;letter-spacing:2px;cursor:pointer;transition:all .22s;border-radius:10px;display:flex;flex-direction:column;align-items:center;gap:5px;min-width:82px;touch-action:manipulation;}
.lang-flag{font-size:1.5rem;line-height:1.1;}
.lang-btn:hover,.lang-btn:active{border-color:#64b4ff;color:#64b4ff;background:rgba(100,180,255,.14);box-shadow:0 0 18px rgba(100,180,255,.22);transform:translateY(-3px) scale(1.04);}

/* ── GAME LAYOUT ── */
#gameWrap{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;background:#000d1a;}

/* ── TOP HUD ── */
#topHud{width:100%;display:flex;justify-content:space-between;align-items:center;padding:12px 16px 0;flex-shrink:0;}
.hud-block{display:flex;flex-direction:column;}
.hud-lbl{font-size:.55rem;letter-spacing:5px;color:rgba(100,180,255,.45);text-transform:uppercase;}
.hud-val{font-family:'Orbitron',monospace;font-size:clamp(1rem,4vw,1.5rem);font-weight:900;color:#e8f4ff;text-shadow:0 0 10px rgba(100,180,255,.5);line-height:1.1;}
.hud-val.gold{color:#ffd700;text-shadow:0 0 8px rgba(255,215,0,.4);}
#topBtns{display:flex;gap:7px;align-items:center;}
.hbtn{width:34px;height:34px;border-radius:50%;background:rgba(0,0,0,.5);border:1px solid rgba(100,180,255,.22);color:rgba(100,180,255,.5);font-size:.52rem;font-weight:800;cursor:pointer;display:flex;align-items:center;justify-content:center;font-family:'Orbitron',monospace;touch-action:manipulation;transition:all .18s;}
.hbtn.on{border-color:rgba(100,180,255,.6);color:#64b4ff;background:rgba(100,180,255,.1);}
.hbtn:hover{border-color:#64b4ff;color:#64b4ff;}

/* ── CANVAS ── */
#canvasWrap{flex:1;display:flex;align-items:center;justify-content:center;width:100%;padding:6px 10px;min-height:0;}
canvas{background:#001224;border:2px solid rgba(100,180,255,.25);border-radius:14px;box-shadow:0 0 24px rgba(100,180,255,.1);display:block;}

/* ── CONTROLS (D-pad) ── */
#dpad{flex-shrink:0;display:grid;grid-template-columns:repeat(3,72px);grid-template-rows:repeat(3,72px);gap:8px;margin:6px 0 14px;}
.dbtn{width:72px;height:72px;background:rgba(100,180,255,.08);border:1.5px solid rgba(100,180,255,.25);border-radius:50%;display:flex;align-items:center;justify-content:center;color:rgba(200,230,255,.8);font-size:24px;cursor:pointer;touch-action:manipulation;transition:all .12s;-webkit-tap-highlight-color:transparent;}
.dbtn:active{background:rgba(100,180,255,.25);transform:scale(.92);border-color:#64b4ff;}
.dup{grid-column:2;grid-row:1;}
.dleft{grid-column:1;grid-row:2;}
.dright{grid-column:3;grid-row:2;}
.ddown{grid-column:2;grid-row:3;}

/* ── OVERLAYS ── */
.overlay{position:fixed;inset:0;z-index:800;background:rgba(0,8,20,.92);backdrop-filter:blur(12px);display:none;flex-direction:column;align-items:center;justify-content:center;padding:24px;}
.overlay.show{display:flex;animation:fin .3s ease;}
@keyframes fin{from{opacity:0;transform:scale(.96);}to{opacity:1;transform:scale(1);}}
.ov-logo{font-family:'Orbitron',monospace;font-size:clamp(1.6rem,6vw,2.6rem);font-weight:900;color:#e8f4ff;text-shadow:0 0 28px rgba(100,180,255,.7);letter-spacing:5px;text-align:center;margin-bottom:6px;}
.ov-sub{font-size:.68rem;letter-spacing:5px;color:rgba(100,180,255,.4);text-transform:uppercase;margin-bottom:28px;}
.ov-statbox{background:rgba(100,180,255,.05);border:1px solid rgba(100,180,255,.18);border-radius:12px;padding:14px 28px;margin-bottom:22px;min-width:220px;text-align:center;}
.ov-stat{font-size:.9rem;color:rgba(255,255,255,.6);margin:5px 0;}
.ov-stat b{font-family:'Orbitron',monospace;color:#64b4ff;}
.ov-stat.gold b{color:#ffd700;}
.obtn{background:rgba(100,180,255,.1);border:1.5px solid rgba(100,180,255,.4);color:#64b4ff;padding:13px 36px;font-family:'Orbitron',monospace;font-size:.78rem;font-weight:700;letter-spacing:3px;cursor:pointer;border-radius:8px;transition:all .2s;margin:5px;text-transform:uppercase;touch-action:manipulation;display:block;width:75%;text-align:center;}
.obtn:hover{background:rgba(100,180,255,.2);box-shadow:0 0 18px rgba(100,180,255,.3);}
.obtn.dim{border-color:rgba(255,255,255,.16);color:rgba(255,255,255,.38);}
.obtn.dim:hover{border-color:rgba(255,255,255,.4);color:#fff;}

/* speed indicator */
#speedBar{height:3px;background:rgba(100,180,255,.15);border-radius:2px;overflow:hidden;margin-top:3px;}
#speedFill{height:100%;background:linear-gradient(90deg,#64b4ff,#ff6464);border-radius:2px;transition:width .4s;}

/* pause overlay */

</style>
</head>
<body>

<!-- SNOWFLAKES -->
<div class="snowflakes" id="snow"></div>

<!-- LANG SCREEN -->
<div id="langScr">
  <div class="logo">SNOW DASH</div>
  <div class="logo-sub">Arctic Snake Adventure</div>
  <div class="lang-hint">Select Language / Tilni tanlang / &#1042;&#1099;&#1073;&#1077;&#1088;&#1080;&#1090;&#1077; &#1103;&#1079;&#1099;&#1082;</div>
  <div class="lang-row">
    <button class="lang-btn" onclick="pickLang('uz')"><span class="lang-flag">&#127482;&#127487;</span>UZ</button>
    <button class="lang-btn" onclick="pickLang('ru')"><span class="lang-flag">&#127479;&#127482;</span>RU</button>
    <button class="lang-btn" onclick="pickLang('en')"><span class="lang-flag">&#127468;&#127463;</span>EN</button>
  </div>
</div>

<!-- GAME WRAP -->
<div id="gameWrap">
  <!-- TOP HUD -->
  <div id="topHud">
    <div class="hud-block">
      <div class="hud-lbl" id="hScoreLbl">GIFTS</div>
      <div class="hud-val" id="hScore">0</div>
      <div id="speedBar"><div id="speedFill" style="width:5%"></div></div>
    </div>
    <div class="hud-block" style="align-items:center;">
      <div class="hud-lbl" id="hBestLbl">BEST</div>
      <div class="hud-val gold" id="hBest">0</div>
    </div>
    <div id="topBtns">
      <button class="hbtn on" id="btnMus" onclick="toggleMus()">MUS</button>
      <button class="hbtn on" id="btnSfx" onclick="toggleSfx()">SFX</button>
      <button class="hbtn" onclick="goLang()">&#127760;</button>
    </div>
  </div>

  <!-- CANVAS -->
  <div id="canvasWrap">
    <canvas id="gameCanvas"></canvas>
  </div>

  <!-- D-PAD -->
  <div id="dpad">
    <div class="dbtn dup"   onclick="changeDir('up')">&#9650;</div>
    <div class="dbtn dleft" onclick="changeDir('left')">&#9664;</div>
    <div class="dbtn dright"onclick="changeDir('right')">&#9654;</div>
    <div class="dbtn ddown" onclick="changeDir('down')">&#9660;</div>
  </div>
</div>

<!-- START OVERLAY -->
<div id="startOv" class="overlay">
  <div class="ov-logo">SNOW DASH</div>
  <div class="ov-sub" id="ov_sub">ARCTIC SNAKE ADVENTURE</div>
  <div class="ov-statbox" id="ov_bestbox" style="display:none">
    <div class="ov-stat gold">&#11088; <b id="ov_best">0</b></div>
  </div>
  <button class="obtn" onclick="startGame()" id="ov_play">PLAY</button>
  <button class="obtn dim" onclick="goLang()" id="ov_lang">LANGUAGE</button>
</div>

<!-- GAME OVER OVERLAY -->
<div id="goOv" class="overlay">
  <div class="ov-logo" id="go_title">GAME OVER</div>
  <div class="ov-sub" id="go_sub">TRY AGAIN</div>
  <div class="ov-statbox">
    <div class="ov-stat">&#10052; <b id="go_score">0</b></div>
    <div class="ov-stat gold">&#127942; <b id="go_best">0</b></div>
  </div>
  <button class="obtn" onclick="restartGame()" id="go_restart">PLAY AGAIN</button>
  <button class="obtn dim" onclick="goLang()"  id="go_lang">LANGUAGE</button>
</div>
</div>

<script>
// ════════════════════════════════════
// TRANSLATIONS
// ════════════════════════════════════
var T = {
  uz:{
    hScoreLbl:"SOVG'A",
    hBestLbl:"REKORD",
    ov_sub:"ARKTIK ILON SARGUZASHTI",
    ov_play:"O'YNASH",
    ov_lang:"TIL",
    go_title:"O'YIN TUGADI!",
    go_sub:"QAYTA URINIB KO'RING",
    go_restart:"QAYTA BOSHLASH",
    go_lang:"TIL"
  },
  ru:{
    hScoreLbl:"\u041e\u0427\u041a\u0418",
    hBestLbl:"\u0420\u0415\u041a\u041e\u0420\u0414",
    ov_sub:"\u0410\u0420\u041a\u0422\u0418\u0427\u0415\u0421\u041a\u0410\u042f \u0417\u041c\u0415\u042f",
    ov_play:"\u0418\u0413\u0420\u0410\u0422\u042c",
    ov_lang:"\u042f\u0417\u042b\u041a",
    go_title:"\u0418\u0413\u0420\u0410 \u041e\u041a\u041e\u041d\u0427\u0415\u041d\u0410!",
    go_sub:"\u041f\u041e\u041f\u0420\u041e\u0411\u0423\u0419\u0422\u0415 \u0415\u0429\u0401 \u0420\u0410\u0417",
    go_restart:"\u0418\u0413\u0420\u0410\u0422\u042c \u0421\u041d\u041e\u0412\u0410",
    go_lang:"\u042f\u0417\u042b\u041a"
  },
  en:{
    hScoreLbl:"GIFTS",
    hBestLbl:"BEST",
    ov_sub:"ARCTIC SNAKE ADVENTURE",
    ov_play:"PLAY",
    ov_lang:"LANGUAGE",
    go_title:"GAME OVER",
    go_sub:"TRY AGAIN",
    go_restart:"PLAY AGAIN",
    go_lang:"LANGUAGE"
  }
};

var curLang = 'en';
var bestScore = 0;

function pickLang(l){
  curLang = l;
  initAudio();
  document.getElementById('langScr').style.display = 'none';
  document.getElementById('gameWrap').style.display = 'flex';
  applyLang();
  showStartOv();
}

function applyLang(){
  var t = T[curLang];
  ['hScoreLbl','hBestLbl','ov_sub','ov_play','ov_lang',
   'go_title','go_sub','go_restart','go_lang'].forEach(function(id){
    var el = document.getElementById(id);
    if(el && t[id] !== undefined) el.textContent = t[id];
  });
}

function goLang(){
  stopMusic();
  gameActive = false; paused = false;
  document.getElementById('goOv').classList.remove('show');
  document.getElementById('startOv').classList.remove('show');
  document.getElementById('gameWrap').style.display = 'none';
  document.getElementById('langScr').style.display = 'flex';
}

function showStartOv(){
  if(bestScore > 0){
    document.getElementById('ov_bestbox').style.display = 'block';
    document.getElementById('ov_best').textContent = bestScore;
  }
  document.getElementById('startOv').classList.add('show');
}

// ════════════════════════════════════
// SNOWFLAKES DECORATION
// ════════════════════════════════════
(function(){
  var container = document.getElementById('snow');
  for(var i=0;i<22;i++){
    var s=document.createElement('div');
    s.className='sf';
    s.textContent='❄';
    s.style.left=Math.random()*100+'%';
    s.style.animationDuration=(4+Math.random()*8)+'s';
    s.style.animationDelay=(-Math.random()*10)+'s';
    s.style.fontSize=(.5+Math.random()*.8)+'rem';
    container.appendChild(s);
  }
})();

// ════════════════════════════════════
// AUDIO
// ════════════════════════════════════
var actx = null;
var musOn = true, sfxOn = true;
// ── AUDIO ──
// Original R-SANTA usuli: barcha notalar AudioContext da oldindan jadvallanadi
// setInterval bilan aniq vaqtda qayta o'ynatiladi — hech qanday ritm muammosi yo'q

var mTimer = null;   // setInterval ID

var MELODY = [
  {f:196.0, d:0.4},
  {f:261.6, d:0.4},
  {f:261.6, d:0.2}, {f:293.7, d:0.2}, {f:261.6, d:0.2}, {f:246.9, d:0.2},
  {f:220.0, d:0.4}, {f:220.0, d:0.4},
  {f:220.0, d:0.4},
  {f:293.7, d:0.4},
  {f:293.7, d:0.2}, {f:329.6, d:0.2}, {f:293.7, d:0.2}, {f:261.6, d:0.2},
  {f:246.9, d:0.4}, {f:196.0, d:0.4},
  {f:196.0, d:0.4},
  {f:329.6, d:0.4},
  {f:329.6, d:0.2}, {f:349.2, d:0.2}, {f:329.6, d:0.2}, {f:293.7, d:0.2},
  {f:261.6, d:0.4}, {f:220.0, d:0.4},
  {f:196.0, d:0.2}, {f:196.0, d:0.2}, {f:293.7, d:0.4}, {f:246.9, d:0.4},
  {f:261.6, d:0.8}
];
var MEL_DURATION = MELODY.reduce(function(s,n){return s+n.d;},0); // ~10s

function initAudio(){
  if(actx) return;
  actx = new (window.AudioContext || window.webkitAudioContext)();
}
function resumeAudio(){
  if(actx && actx.state==='suspended') actx.resume();
}

function playTone(freq, type, start, duration, vol){
  if(!actx) return;
  var osc = actx.createOscillator();
  var g   = actx.createGain();
  osc.type = type;
  osc.frequency.setValueAtTime(freq, start);
  g.gain.setValueAtTime(0, start);
  g.gain.linearRampToValueAtTime(vol, start + 0.05);
  g.gain.linearRampToValueAtTime(0,   start + duration);
  osc.connect(g);
  g.connect(actx.destination);
  osc.start(start);
  osc.stop(start + duration);
}

// Barcha notalar bir vaqtda AudioContext ga yuklanadi — bitta call, bitta ritm
function playFullMelody(){
  if(!actx || !musOn) return;
  var t = actx.currentTime;
  MELODY.forEach(function(n){
    playTone(n.f, 'triangle', t, n.d, 0.10);
    playTone(n.f, 'sine',     t, n.d, 0.05);
    t += n.d;
  });
}

function startMusic(){
  if(!actx || !musOn) return;
  // Avvalgi intervalni bekor qil
  if(mTimer){ clearInterval(mTimer); mTimer = null; }
  // Darhol bir marta o'yna
  playFullMelody();
  // Melodiya davomiyligiga mos ravishda qayta o'ynash
  mTimer = setInterval(function(){
    if(!musOn){ stopMusic(); return; }
    playFullMelody();
  }, MEL_DURATION * 1000);
}

function stopMusic(){
  if(mTimer){ clearInterval(mTimer); mTimer = null; }
}
function toggleMus(){
  musOn=!musOn;
  document.getElementById('btnMus').classList.toggle('on',musOn);
  if(musOn){ initAudio(); resumeAudio(); if(gameActive) startMusic(); }
  else stopMusic();
}
function toggleSfx(){
  sfxOn=!sfxOn;
  document.getElementById('btnSfx').classList.toggle('on',sfxOn);
}

// SFX
function sfxEat(){
  if(!sfxOn||!actx) return;
  var t = actx.currentTime;
  playTone(880,  'sine', t,       0.08, 0.10);
  playTone(1100, 'sine', t+0.06,  0.06, 0.07);
}
function sfxBonus(){
  if(!sfxOn||!actx) return;
  var t = actx.currentTime;
  [880,1100,1320,1760].forEach(function(f,i){
    playTone(f, 'triangle', t + i*0.055, 0.09, 0.08);
  });
}
function sfxDie(){
  if(!sfxOn||!actx) return;
  var t = actx.currentTime;
  playTone(200, 'sawtooth', t,      0.15, 0.20);
  playTone(100, 'sawtooth', t+0.10, 0.20, 0.18);
  playTone(60,  'sawtooth', t+0.25, 0.30, 0.15);
}
function sfxStart(){
  if(!sfxOn||!actx) return;
  var t = actx.currentTime;
  [392,523.3,659.3,783.9].forEach(function(f,i){
    playTone(f, 'triangle', t + i*0.08, 0.10, 0.08);
  });
}

// ════════════════════════════════════
// CANVAS + GAME STATE
// ════════════════════════════════════
var cv = document.getElementById('gameCanvas');
var ctx = cv.getContext('2d');
var GRID = 20;
var gameActive = false, paused = false;
var count = 0, score = 0, appleCount = 0;
var speedLevel = 1;    // 1..10
var frameLimit = 18;   // frame skip — kamaysa tezlashadi

var snake, apple, bonus;
var particles = [];

function initSnake(){
  var cx = Math.floor(cv.width/2/GRID)*GRID;
  var cy = Math.floor(cv.height/2/GRID)*GRID;
  snake = {x:cx, y:cy, dx:GRID, dy:0, cells:[], maxCells:4};
}
function initApple(){
  apple = {
    x: Math.floor(Math.random()*(cv.width/GRID))*GRID,
    y: Math.floor(Math.random()*(cv.height/GRID))*GRID
  };
}
function resetBonus(){ bonus = {active:false, x:0, y:0, timer:0, type:0}; }

// ════════════════════════════════════
// CANVAS SIZING
// ════════════════════════════════════
function sizeCanvas(){
  var wrap = document.getElementById('canvasWrap');
  var W = wrap.clientWidth - 20;
  var H = wrap.clientHeight - 12;
  W = Math.floor(W/GRID)*GRID;
  H = Math.floor(H/GRID)*GRID;
  if(W < 160) W = 160;
  if(H < 120) H = 120;
  cv.width = W; cv.height = H;
}

// ════════════════════════════════════
// INPUT
// ════════════════════════════════════
// Keyboard
document.addEventListener('keydown', function(e){
  if(['ArrowUp','KeyW'].includes(e.code))    changeDir('up');
  if(['ArrowDown','KeyS'].includes(e.code))  changeDir('down');
  if(['ArrowLeft','KeyA'].includes(e.code))  changeDir('left');
  if(['ArrowRight','KeyD'].includes(e.code)) changeDir('right');
  e.preventDefault();
});

// Swipe (touch)
var swipeX = 0, swipeY = 0;
cv.addEventListener('touchstart',function(e){
  swipeX = e.touches[0].clientX;
  swipeY = e.touches[0].clientY;
  e.preventDefault();
},{passive:false});
cv.addEventListener('touchend',function(e){
  var dx = e.changedTouches[0].clientX - swipeX;
  var dy = e.changedTouches[0].clientY - swipeY;
  if(Math.abs(dx) < 12 && Math.abs(dy) < 12) return;
  if(Math.abs(dx) > Math.abs(dy)){
    changeDir(dx > 0 ? 'right' : 'left');
  } else {
    changeDir(dy > 0 ? 'down' : 'up');
  }
},{passive:false});

function changeDir(dir){
  if(!gameActive) return;
  if(dir==='up'    && snake.dy===0){ snake.dy=-GRID; snake.dx=0; }
  if(dir==='down'  && snake.dy===0){ snake.dy=GRID;  snake.dx=0; }
  if(dir==='left'  && snake.dx===0){ snake.dx=-GRID; snake.dy=0; }
  if(dir==='right' && snake.dx===0){ snake.dx=GRID;  snake.dy=0; }
}

// ════════════════════════════════════

// ════════════════════════════════════
// PARTICLES
// ════════════════════════════════════
function burst(x,y,col,n){
  for(var i=0;i<n;i++){
    var a=Math.random()*Math.PI*2, s=Math.random()*3.5+1;
    particles.push({x:x+GRID/2,y:y+GRID/2,vx:Math.cos(a)*s,vy:Math.sin(a)*s,
      r:Math.random()*3+1,col:col,life:1});
  }
}

// ════════════════════════════════════
// SPEED SYSTEM
// ════════════════════════════════════
function updateSpeed(){
  // score 0→5: 18f, 5→15: 15f, 15→30: 12f, 30+: 9f
  if(score < 8)       { frameLimit=30; speedLevel=1; }
  else if(score < 20) { frameLimit=25; speedLevel=3; }
  else if(score < 40) { frameLimit=20; speedLevel=6; }
  else if(score < 60) { frameLimit=16; speedLevel=8; }
  else                { frameLimit=13; speedLevel=10; }
  var pct = speedLevel*10;
  document.getElementById('speedFill').style.width = pct+'%';
}

// ════════════════════════════════════
// DRAW HELPERS
// ════════════════════════════════════
function drawApple(x,y){
  // Qor uyumi ustida sovg'a quti
  ctx.save();
  // Gift box
  ctx.fillStyle = '#ff4444';
  ctx.beginPath();
  ctx.roundRect ? ctx.roundRect(x+2,y+3,GRID-4,GRID-5,3) : ctx.rect(x+2,y+3,GRID-4,GRID-5);
  ctx.fill();
  // Ribbon yashil
  ctx.strokeStyle = '#88ff88';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(x+GRID/2,y+3); ctx.lineTo(x+GRID/2,y+GRID-2);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(x+2,y+GRID/2); ctx.lineTo(x+GRID-2,y+GRID/2);
  ctx.stroke();
  // Bow
  ctx.fillStyle = '#aaffaa';
  ctx.beginPath();
  ctx.arc(x+GRID/2, y+4, 2.5, 0, Math.PI*2);
  ctx.fill();
  ctx.restore();
}

function drawBonus(x,y,timer){
  ctx.save();
  var pulse = 0.85 + 0.15*Math.sin(timer*0.3);
  ctx.globalAlpha = 0.75 + 0.25*Math.sin(timer*0.5);
  // Yulduz shakl
  ctx.fillStyle = (Math.floor(timer/4)%2===0) ? '#ffd700' : '#ff8800';
  ctx.shadowColor = '#ffd700'; ctx.shadowBlur = 12;
  var cx2=x+GRID/2, cy2=y+GRID/2, r1=GRID/1.8*pulse, r2=GRID/3.5*pulse;
  ctx.beginPath();
  for(var i=0;i<10;i++){
    var ang = (i*Math.PI/5) - Math.PI/2;
    var r = (i%2===0) ? r1 : r2;
    if(i===0) ctx.moveTo(cx2+r*Math.cos(ang),cy2+r*Math.sin(ang));
    else ctx.lineTo(cx2+r*Math.cos(ang),cy2+r*Math.sin(ang));
  }
  ctx.closePath(); ctx.fill();
  ctx.restore();
}

function drawSnake(){
  snake.cells.forEach(function(cell, idx){
    ctx.save();
    if(idx === 0){
      // HEAD
      var grad = ctx.createRadialGradient(
        cell.x+GRID/2-2, cell.y+GRID/2-2, 1,
        cell.x+GRID/2, cell.y+GRID/2, GRID/1.5
      );
      grad.addColorStop(0,'#ffffff');
      grad.addColorStop(0.4,'#90d4ff');
      grad.addColorStop(1,'#1a8fbf');
      ctx.fillStyle = grad;
      ctx.shadowColor = '#64b4ff'; ctx.shadowBlur = 8;
      ctx.beginPath();
      ctx.roundRect ? ctx.roundRect(cell.x+1,cell.y+1,GRID-2,GRID-2,4) : ctx.fillRect(cell.x+1,cell.y+1,GRID-2,GRID-2);
      ctx.fill();
      // Ko'zlar
      var ex = cell.x + (snake.dx>0?GRID-5:(snake.dx<0?3:GRID/2-3));
      var ey = cell.y + (snake.dy>0?GRID-5:(snake.dy<0?3:GRID/2-2));
      ctx.fillStyle = '#001a2e'; ctx.shadowBlur=0;
      ctx.beginPath(); ctx.arc(ex,ey,2,0,Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(ex+(snake.dx===0?6:0), ey+(snake.dy===0?4:0), 2,0,Math.PI*2); ctx.fill();
    } else {
      // BODY
      var pct2 = idx / snake.cells.length;
      var r = Math.floor(30+pct2*30);
      var g2 = Math.floor(130-pct2*60);
      var b = Math.floor(200-pct2*80);
      ctx.fillStyle = 'rgb('+r+','+g2+','+b+')';
      ctx.shadowColor = 'rgba(100,180,255,.3)'; ctx.shadowBlur = 4;
      var pad = 1 + idx*0.06;
      var sz = Math.max(GRID-4, GRID-4-idx*0.3);
      ctx.beginPath();
      ctx.roundRect ? ctx.roundRect(cell.x+pad,cell.y+pad,sz,sz,3) : ctx.fillRect(cell.x+pad,cell.y+pad,sz,sz);
      ctx.fill();
    }
    ctx.restore();
  });
}

function drawBg(){
  // Gradient background
  var grad = ctx.createLinearGradient(0,0,0,cv.height);
  grad.addColorStop(0,'#001224');
  grad.addColorStop(1,'#000d1a');
  ctx.fillStyle = grad;
  ctx.fillRect(0,0,cv.width,cv.height);
  // Grid dots (yengil)
  ctx.fillStyle = 'rgba(100,180,255,.04)';
  for(var x=0;x<=cv.width;x+=GRID){
    for(var y=0;y<=cv.height;y+=GRID){
      ctx.beginPath(); ctx.arc(x,y,1,0,Math.PI*2); ctx.fill();
    }
  }
}

// ════════════════════════════════════
// MAIN LOOP
// ════════════════════════════════════
function loop(){
  requestAnimationFrame(loop);
  if(!gameActive) return;
  if(++count < frameLimit) return;
  count = 0;

  drawBg();

  // Particles
  ctx.save();
  for(var i=particles.length-1;i>=0;i--){
    var p=particles[i];
    p.x+=p.vx; p.y+=p.vy; p.vx*=.88; p.vy*=.88; p.life-=.055;
    if(p.life<=0){particles.splice(i,1);continue;}
    ctx.globalAlpha=p.life; ctx.fillStyle=p.col;
    ctx.beginPath(); ctx.arc(p.x,p.y,p.r*p.life,0,Math.PI*2); ctx.fill();
  }
  ctx.globalAlpha=1; ctx.restore();

  drawApple(apple.x, apple.y);

  // Bonus
  if(bonus.active){
    bonus.timer--;
    drawBonus(bonus.x, bonus.y, bonus.timer);
    if(snake.x===bonus.x && snake.y===bonus.y){
      score += 5; snake.maxCells += 2;
      burst(bonus.x, bonus.y, '#ffd700', 16);
      sfxBonus();
      bonus.active = false;
      updateHUD();
    }
    if(bonus.timer <= 0) bonus.active = false;
  }

  // Move snake
  snake.x += snake.dx; snake.y += snake.dy;
  // Wrap
  if(snake.x < 0)           snake.x = cv.width-GRID;
  else if(snake.x >= cv.width)  snake.x = 0;
  if(snake.y < 0)           snake.y = cv.height-GRID;
  else if(snake.y >= cv.height) snake.y = 0;

  snake.cells.unshift({x:snake.x, y:snake.y});
  if(snake.cells.length > snake.maxCells) snake.cells.pop();

  drawSnake();

  // Collisions
  var died = false;
  for(var ci=0;ci<snake.cells.length;ci++){
    var cell = snake.cells[ci];
    // Apple
    if(ci===0 && cell.x===apple.x && cell.y===apple.y){
      score++; appleCount++; snake.maxCells++;
      burst(apple.x, apple.y, '#ff4444', 10);
      sfxEat();
      updateSpeed();
      updateHUD();
      placeApple();
      // Har 5 ta apple — bonus
      if(appleCount % 5 === 0){
        bonus.x = Math.floor(Math.random()*(cv.width/GRID))*GRID;
        bonus.y = Math.floor(Math.random()*(cv.height/GRID))*GRID;
        bonus.active = true; bonus.timer = 80; bonus.type = 0;
      }
    }
    // Self collision (head vs body)
    if(ci > 0 && cell.x===snake.cells[0].x && cell.y===snake.cells[0].y){
      died = true;
    }
  }

  if(died){
    gameActive = false;
    stopMusic();
    sfxDie();
    setTimeout(showGameOver, 600);
  }
}

function placeApple(){
  var placed = false;
  while(!placed){
    var ax = Math.floor(Math.random()*(cv.width/GRID))*GRID;
    var ay = Math.floor(Math.random()*(cv.height/GRID))*GRID;
    // ilon ustiga tushmasin
    var onSnake = snake.cells.some(function(c){return c.x===ax&&c.y===ay;});
    if(!onSnake){ apple.x=ax; apple.y=ay; placed=true; }
  }
}

// ════════════════════════════════════
// UI HELPERS
// ════════════════════════════════════
function updateHUD(){
  document.getElementById('hScore').textContent = score;
  if(score > bestScore){
    bestScore = score;
    document.getElementById('hBest').textContent = bestScore;
  }
}

function showGameOver(){
  if(score > bestScore) bestScore = score;
  document.getElementById('go_score').textContent = score;
  document.getElementById('go_best').textContent  = bestScore;
  document.getElementById('goOv').classList.add('show');
}

// ════════════════════════════════════
// GAME CONTROLS
// ════════════════════════════════════
function startGame(){
  initAudio(); resumeAudio();
  sizeCanvas();
  document.getElementById('startOv').classList.remove('show');
  document.getElementById('goOv').classList.remove('show');
  score=0; appleCount=0; count=0; paused=false;
  particles.length=0;
  initSnake(); initApple(); resetBonus();
  updateSpeed(); updateHUD();
  gameActive = true;
  
  sfxStart();
  if(musOn) startMusic();
}

function restartGame(){
  document.getElementById('goOv').classList.remove('show');
  startGame();
}

// ════════════════════════════════════
// BOOT
// ════════════════════════════════════
loop();
</script>
